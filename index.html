
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Crazy Rainbow · 小南娘资质测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #fde9f0 0%, #ffe6f0 100%);
            font-family: 'Comic Neue', 'Comic Neue', 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', 'Poppins', cursive, sans-serif;
            padding: 30px 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .pony-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 245, 0.85);
            border-radius: 1000px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            backdrop-filter: blur(3px);
        }

        .rainbow {
            position: absolute;
            height: 12px;
            border-radius: 20px;
            background: linear-gradient(90deg, #ff77aa, #ffaa77, #ffff77, #77ff77, #77aaff, #c277ff);
            opacity: 0.3;
            transform: rotate(-5deg);
        }

        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 252, 245, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 64px 48px 64px 48px;
            box-shadow: 0 25px 45px rgba(192, 112, 148, 0.25), 0 0 0 3px #ffe0f0, 0 0 0 8px #ffc0dd;
            padding: 30px 28px 45px;
            position: relative;
            z-index: 2;
            transition: filter 0.2s;
        }

        .expired-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            flex-direction: column;
            gap: 20px;
        }
        .expired-card {
            background: #ffecf0;
            color: #b34b6e;
            padding: 40px 30px;
            border-radius: 60px;
            max-width: 90%;
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
        }
        .expired-card button {
            margin-top: 20px;
            background: #f29fbf;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
        }

        .hero {
            text-align: center;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #e06c9e, #ffac7a, #ffda7a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
            padding: 0 12px;
        }

        .cutie-mark {
            font-size: 2.5rem;
            display: inline-block;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            margin: 0 5px;
        }

        .sub {
            background: #ffecf0;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 60px;
            color: #b34b6e;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .desc {
            text-align: center;
            margin: 20px 0 12px;
            color: #ad6a86;
            font-weight: 500;
            background: #fff0f5cc;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
        }

        .progress-area {
            margin: 10px 0 20px;
            background: #ffdfe9;
            border-radius: 60px;
            padding: 5px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .progress-text {
            font-weight: bold;
            color: #b34b6e;
            background: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        .progress-bar-bg {
            flex: 1;
            height: 10px;
            background: #ffc0d0;
            border-radius: 30px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #f8a5c2, #f2628c);
            border-radius: 30px;
            transition: width 0.2s ease;
        }

        /* 单问题卡片 */
        .question-card {
            background: #fffafc;
            border-radius: 48px;
            padding: 28px 24px;
            margin: 20px 0;
            box-shadow: 0 12px 24px rgba(0,0,0,0.05);
            text-align: center;
        }

        .q-num-large {
            background: #ffb7cf;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 16px;
        }

        .q-text-large {
            font-size: 1.4rem;
            font-weight: 600;
            color: #673147;
            margin: 20px 0;
            line-height: 1.4;
        }

        .scale-row-vertical {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 30px 0;
        }

        .scale-option {
            background: #fef3f7;
            border-radius: 60px;
            padding: 14px 16px;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid #fbc4d7;
            font-size: 1rem;
            font-weight: 500;
            color: #ad5e7e;
            text-align: center;
        }

        .scale-option.selected {
            background: #e99ebc;
            border-color: #c04e76;
            color: white;
            box-shadow: 0 4px 8px #d97e9f80;
            transform: scale(0.98);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin: 20px 0;
        }

        .btn {
            border: none;
            background: #ffe3ed;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 48px;
            color: #b94b72;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 0 #d99eb9;
            font-family: inherit;
            flex: 1;
        }

        .btn-primary {
            background: #f29fbf;
            color: white;
            box-shadow: 0 3px 0 #b64f74;
        }

        .btn-primary:active, .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #d99eb9;
        }

        .result-card {
            background: #fff2f7dd;
            border-radius: 48px;
            padding: 22px 24px;
            margin-top: 20px;
            border: 2px solid #ffcce0;
            backdrop-filter: blur(6px);
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #b53f6a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spectrum {
            font-size: 1rem;
            background: #ffdee9;
            padding: 10px 16px;
            border-radius: 32px;
            margin: 15px 0;
        }

        .result-desc {
            line-height: 1.5;
            color: #5e3a48;
        }

        .notice-box {
            background: #fff0e0;
            border-left: 6px solid #e99ebc;
            border-radius: 28px;
            padding: 14px 18px;
            margin: 20px 0 10px;
            font-size: 0.8rem;
            color: #a55672;
        }
        .notice-box p {
            margin: 6px 0;
        }

        .disclaimer {
            font-size: 0.75rem;
            text-align: center;
            margin-top: 20px;
            color: #c78aa8;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 20px;
            color: #e6a6c0;
        }

        @media (max-width: 600px) {
            .test-container { padding: 20px 18px; }
            .q-text-large { font-size: 1.2rem; }
            .scale-option { padding: 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="pony-bg" id="ponyBg"></div>
<div class="test-container" id="appContainer">
    <div class="hero">
        <span class="cutie-mark">🎀🦄</span>
        <h1>小南娘资质测试</h1>
        <span class="cutie-mark">🌈✨</span>
        <div class="sub">每页一题 · 温柔探索</div>
    </div>
    <div class="desc">
        💖 请根据真实感受选择，答案没有对错。完成全部28题后获得专属解读。
    </div>

    <div class="progress-area">
        <span class="progress-text" id="qCounter">第1 / 28题</span>
        <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="answeredCount">已答 0 / 28</span>
    </div>

    <!-- 动态当前问题卡片 -->
    <div id="questionCard" class="question-card"></div>

    <div class="nav-buttons">
        <button class="btn" id="prevBtn" disabled>🐴 上一题</button>
        <button class="btn btn-primary" id="nextBtn">下一题 🌟</button>
    </div>
    <div class="action-buttons" style="text-align: center; margin-top: 10px;">
        <button class="btn" id="resetBtn" style="background:#ffe3ed;">🦄 重选所有答案</button>
    </div>

    <div id="resultArea" class="result-card" style="display: none;"></div>
    <div class="disclaimer">
        ⚡ 本测试结果基于自我报告，仅供自我探索与娱乐，不构成专业诊断。
    </div>
    <footer>💖 献给所有喜欢粉色、裙子和魔法的小马们 💖</footer>
</div>

<script>
    // ======================= 时效性检测模块 =======================
    const STORAGE_KEY = 'pony_test_start_time';
    const EXPIRY_HOURS = 24;

    function isTestExpired() {
        const startTime = localStorage.getItem(STORAGE_KEY);
        if (!startTime) {
            const now = Date.now();
            localStorage.setItem(STORAGE_KEY, now);
            return false;
        }
        const elapsed = Date.now() - parseInt(startTime, 10);
        const hoursPassed = elapsed / (1000 * 60 * 60);
        return hoursPassed >= EXPIRY_HOURS;
    }

    function showExpiredOverlay() {
        const overlay = document.createElement('div');
        overlay.className = 'expired-overlay';
        overlay.innerHTML = `
            <div class="expired-card">
                🌸 测试链接已过期 🌸<br><br>
                本测评仅在首次访问后的24小时内有效。<br>
                您已经超过了使用时限。<br>
                <button onclick="location.reload()">尝试重新加载</button>
                <p style="font-size:0.9rem; margin-top:20px;">注：清除浏览器缓存可能重新计时，但请尊重测试规则。</p>
            </div>
        `;
        document.body.appendChild(overlay);
        const container = document.getElementById('appContainer');
        if (container) {
            container.style.filter = 'blur(4px)';
            container.style.pointerEvents = 'none';
        }
    }

    // ======================= 28个问题 =======================
    const QUESTIONS = [
        "我觉得自己内心更倾向于女性身份，而不是我出生时的男性性别。",
        "当别人用“他”称呼我时，我会感到轻微的不适或别扭。",
        "我渴望被他人以女性化的名字或昵称（如“姐姐”、“妹妹”）来称呼。",
        "我希望自己的外在形象能更接近女性（如更柔和的面部、更细的腰）。",
        "我对自己的男性性征（如喉结、体毛）感到一定程度的不满意。",
        "穿女装（裙子、丝袜、内衣）会让我感到放松、愉悦甚至兴奋。",
        "我幻想过以女性身份生活，并且这种幻想经常出现。",
        "在社交场合，我常常需要压抑自己女性化的一面，这让我很累。",
        "我会私下学习化妆、穿搭或练习女性化的声音。",
        "我觉得“小男娘”或“跨性别女性”这类标签能部分描述我的真实感受。",
        "我认为性别不应该限制一个人的穿着和行为，男生也可以完全少女化。",
        "我更喜欢和女生做朋友，因为和男生相处时常觉得格格不入。",
        "我害怕公开自己的女性化爱好，担心被歧视或嘲笑。",
        "我希望能找到一个能完全接纳我女性化一面的伴侣或社群。",
        "照镜子时，我常常希望看到的是一个女孩的脸。",
        "即使没有性方面的动机，女装也让我感到心理上的满足。",
        "我会购买或收藏可爱的女性化物品（如发饰、玩偶、裙子）。",
        "我常常觉得自己比别人更敏感、更细腻，更像传统意义上的“女性气质”。",
        "如果完全安全，我会愿意以女性身份在社交媒体上活动。",
        "我对自己出生时的男性性别有一种“不对劲”或“错位”的感觉。",
        "我渴望被当作可爱的、需要被保护的人来对待。",
        "我对传统的男性竞争、粗犷活动（如球类、打架）毫无兴趣甚至反感。",
        "我会在独处时尝试完全以女性身份生活（如穿女装、用女声说话）。",
        "我希望未来的医学技术能让我拥有女性身体特征。",
        "我认为“合格的小男娘”不是一种标准，而是一种自我接纳的勇气。",
        "我常常在网上搜索关于男娘、跨性别、性别表达的内容。",
        "如果得到家人朋友支持，我会更勇敢地展现自己的女性化一面。",
        "总的来说，我觉得自己就是一只藏在男孩身体里的小雌驹（小马）。"
    ];

    // 选项标签
    const OPTION_LABELS = ['1 完全不是', '2 不太符合', '3 有点符合', '4 比较符合', '5 完全符合'];

    // 存储答案 (1-5)
    let userAnswers = new Array(28).fill(null);
    let currentIndex = 0;      // 0-based

    // DOM 元素
    const questionCard = document.getElementById('questionCard');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultArea = document.getElementById('resultArea');
    const qCounterSpan = document.getElementById('qCounter');
    const answeredCountSpan = document.getElementById('answeredCount');
    const progressFill = document.getElementById('progressFill');

    // 更新进度显示
    function updateProgressDisplay() {
        const answered = userAnswers.filter(a => a !== null).length;
        const percent = (answered / 28) * 100;
        progressFill.style.width = percent + '%';
        answeredCountSpan.innerText = `已答 ${answered} / 28`;
        qCounterSpan.innerText = `第${currentIndex+1} / 28题`;
    }

    // 渲染当前问题
    function renderCurrentQuestion() {
        const qText = QUESTIONS[currentIndex];
        const currentAnswer = userAnswers[currentIndex];
        let optionsHtml = '';
        for (let val = 1; val <= 5; val++) {
            const selectedClass = (currentAnswer === val) ? 'selected' : '';
            optionsHtml += `
                <div class="scale-option ${selectedClass}" data-val="${val}">
                    ${OPTION_LABELS[val-1]}
                </div>
            `;
        }

        const html = `
            <div style="text-align: center;">
                <div class="q-num-large">${currentIndex+1}</div>
                <div class="q-text-large">${qText}</div>
                <div class="scale-row-vertical" id="optionsContainer">
                    ${optionsHtml}
                </div>
            </div>
        `;
        questionCard.innerHTML = html;

        // 绑定选项点击事件
        document.querySelectorAll('.scale-option').forEach(opt => {
            opt.addEventListener('click', (e) => {
                const val = parseInt(opt.dataset.val);
                if (isNaN(val)) return;
                // 更新答案
                userAnswers[currentIndex] = val;
                // 更新当前卡片的UI选中样式
                document.querySelectorAll('.scale-option').forEach(el => el.classList.remove('selected'));
                opt.classList.add('selected');
                updateProgressDisplay();
                // 自动跳转到下一题（如果当前不是最后一题）
                if (currentIndex < 27) {
                    goToNext();
                } else {
                    // 最后一题选择后，自动提交？为了体验，不自动提交，让用户点“下一题”或“查看结果”，但下一题按钮文字会变成“查看结果”
                    updateNextButtonText();
                }
            });
        });
        updateNextButtonText();
        // 更新上一题按钮状态
        prevBtn.disabled = (currentIndex === 0);
    }

    function updateNextButtonText() {
        if (currentIndex === 27) {
            nextBtn.innerText = '✨ 完成并查看结果';
        } else {
            nextBtn.innerText = '下一题 🌟';
        }
    }

    function goToPrev() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCurrentQuestion();
            updateProgressDisplay();
        }
    }

    function goToNext() {
        // 检查当前题目是否已回答
        if (userAnswers[currentIndex] === null) {
            alert('🌸 请先选择答案再继续下一题哟～');
            return;
        }
        if (currentIndex === 27) {
            // 已经是最后一题，且已回答，则提交
            computeAndShowResult();
            return;
        }
        currentIndex++;
        renderCurrentQuestion();
        updateProgressDisplay();
    }

    // 重置所有
    function resetAll() {
        userAnswers.fill(null);
        currentIndex = 0;
        resultArea.style.display = 'none';
        resultArea.innerHTML = '';
        renderCurrentQuestion();
        updateProgressDisplay();
    }

    // 结果计算与显示
    function computeAndShowResult() {
        // 检查是否所有题目都已答
        const unanswered = [];
        for (let i = 0; i < userAnswers.length; i++) {
            if (userAnswers[i] === null) unanswered.push(i+1);
        }
        if (unanswered.length > 0) {
            alert(`💖 还有 ${unanswered.length} 道题没有回答～ 请先完成所有题目。\n未完成：${unanswered.slice(0,8).join(',')}${unanswered.length>8?'...':''}`);
            return;
        }

        let totalScore = 0;
        for (let i = 0; i < userAnswers.length; i++) {
            totalScore += userAnswers[i];
        }

        const result = getResultByScore(totalScore);
        const percentage = Math.round((totalScore / 140) * 100);

        const noticeHtml = `
            <div class="notice-box">
            <p><strong>💝 温馨提醒</strong><br>
                本测试为虚拟服务内容，购买成功后不可退换；<br>
                本测试题测试结果及深度解析内容仅供参考娱乐，不能作为就医或证明类凭证。</p>
            </div>
        `;

        const resultHtml = `
            <div class="result-title">
                ${result.emoji} ${result.title}
            </div>
            <div class="spectrum">
                🎀 小南娘指数：${totalScore} / 140 &nbsp; | &nbsp; 纯度 ${percentage}%
            </div>
            <div class="result-desc">
                ${result.desc}
                <hr style="margin: 15px 0; border-color: #ffccdd;">
                <p style="font-size:0.9rem;">💕 记住：无论得分高低，你都是独一无二的小马。小南娘是一种可爱的自我表达，不是束缚。</p>
                <div style="background:#ffeef4; border-radius:28px; padding:12px; margin-top:12px; text-align:center;">
                    🦄 推荐资源：小南娘同好会 | 南娘可爱同盟 | 跨性别友善空间
                </div>
                ${noticeHtml}
            </div>
        `;

        resultArea.style.display = 'block';
        resultArea.innerHTML = resultHtml;
        resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function getResultByScore(score) {
        if (score <= 55) {
            return {
                title: "🍼 萌芽小马驹 · 小南娘萌新",
                desc: "您对出生时被指定的性别认同度较高，内心没有强烈的矛盾。您目前对女性化认同或表达的感受还比较弱，可能只是偶尔好奇或欣赏。没有关系，每个人的自我发现节奏不同。如果您愿意，可以从多看一些可爱的东西开始，慢慢探索内心的彩虹。",
                emoji: "🌸🍼"
            };
        } else if (score <= 80) {
            return {
                title: "🎀 摇摆蝴蝶结 · 潜力小南娘",
                desc: "您内心对于性别角色与表达有一些矛盾和好奇，可能对传统性别框架感到不完全适应，但仍未走向强烈的跨性别认同。这种状态是探索的起点，您可以多尝试不同的衣着、称呼或线上身份，给自己温柔的空间。许多性别酷儿、半性别者都经历过这个阶段。您已经有了一些小南娘的特质，比如喜欢可爱风格、偶尔幻想女装，但可能还缺少一点勇气或更强烈的内心认同。继续倾听自己吧～ 每一次小小的尝试都是成长。",
                emoji: "🎀✨"
            };
        } else if (score <= 105) {
